<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kish Collection - Online Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <!-- Simple pink SVG logo for "Kish Collection" -->
            <svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
                <text x="10" y="35" font-family="Arial" font-size="24" font-weight="bold" fill="pink">Kish Collection</text>
            </svg>
        </div>
        <h1>Welcome to Kish Collection</h1>
        <div class="cart">
            <button id="view-cart">View Cart (0 items)</button>
        </div>
    </header>
    
    <section class="products">
        <h2>Our Products</h2>
        <div class="product-list">
            <!-- Products will be added via JS -->
        </div>
    </section>
    
    <section id="cart-section" class="hidden">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <p>Total: $<span id="cart-total">0</span></p>
        <button id="checkout">Checkout</button>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
